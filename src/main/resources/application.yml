spring:
  application:
    name: n8n-manager
  main:
    web-application-type: none

n8n:
  # Base URL of the n8n instance, e.g. https://n8n.example.com
  base-url: ${N8N_BASE_URL:http://localhost:5678}
  # n8n API key (n8n UI -> Settings -> n8n API). Prefer the N8N_API_KEY env var.
  api-key: ${N8N_API_KEY:}

  # Expected versions of the local-stack dependencies (US-05.5).
  # Canonical record and install procedures: docs/DEPENDENCIES.md
  deps:
    # JDK 21 installation probed by `deps status` (NF-3) — the same path
    # docs/install/install-deps.sh verifies. Deliberately not JAVA_HOME,
    # which on this host is a Java 17 used by other tooling.
    java-home: "/usr/lib/jvm/java-21-openjdk-amd64"
    expected:
      node: ">=24.0.0"
      npm: ">=11.0.0"
      java: ">=21"
      maven: ">=3.9.0"
      # SINGLE SOURCE of the n8n version pin (D-1, US-05.3): install-n8n.sh
      # extracts this value at run time and `n8n upgrade` uses it as the
      # default target version. Raise it here to upgrade the instance;
      # docs/DEPENDENCIES.md records the procedure.
      n8n: "2.48.7"

  # systemd user unit running the local n8n instance (US-05.2).
  # Deployed unit: ~/.config/systemd/user/n8n.service (docs/install/n8n.service)
  service:
    unit: "n8n.service"
    journal-lines: 10
